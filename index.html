<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carmelo's Hero Universe</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:white;background:radial-gradient(circle at top,#26263f,#090912 70%);display:grid;place-items:center;overflow:hidden}
.card{width:min(92vw,520px);text-align:center;padding:34px 24px;border:1px solid #ffffff33;border-radius:28px;background:#11111dcc;box-shadow:0 20px 80px #000}
.small{letter-spacing:3px;text-transform:uppercase;font-size:12px;color:#c8c8d8}.title{font-size:clamp(30px,9vw,54px);font-weight:900;margin:10px 0}.sub{font-size:18px;line-height:1.45;color:#ddd}
button{margin-top:24px;border:0;border-radius:999px;padding:18px 30px;font-size:18px;font-weight:900;cursor:pointer;background:white;color:#111;box-shadow:0 8px 30px #0008}
#result{display:none;margin-top:28px;padding:24px;border-radius:22px;background:#ffffff12;border:1px solid #ffffff22}.result{font-size:38px;font-weight:1000}.mission{margin-top:12px;font-size:18px;line-height:1.5}.spin{animation:pulse .5s infinite alternate}@keyframes pulse{to{transform:scale(1.03);opacity:.65}}
</style>
</head>
<body>
<div class="card">
<div class="small">Carmelo's 5th Birthday • October 10</div>
<div class="title">THE HERO<br>SELECTION</div>
<div class="sub">You don't choose your universe...<br><b>Your universe chooses YOU.</b></div>
<button id="btn">⚡ REVEAL MY UNIVERSE ⚡</button>
<div id="result"><div id="resultText" class="result"></div><div class="mission">Your mission: wear a shirt representing your chosen universe to Carmelo's birthday party!</div></div>
</div>
<script>
const btn=document.getElementById('btn'), result=document.getElementById('result'), text=document.getElementById('resultText');
btn.onclick=()=>{
 btn.disabled=true; btn.classList.add('spin'); result.style.display='block'; text.textContent='DC... MARVEL... DC... MARVEL...';
 let i=0; const timer=setInterval(()=>{text.textContent=i++%2?'MARVEL...':'DC...';},180);
 setTimeout(()=>{clearInterval(timer); btn.classList.remove('spin'); const dc=Math.random()<.5; text.textContent=dc?'🦇 YOU HAVE BEEN CHOSEN BY DC!':'🕷️ YOU HAVE BEEN CHOSEN BY MARVEL!'; btn.textContent='🔄 REVEAL AGAIN'; btn.disabled=false;},1700);
};
</script>
</body></html>
